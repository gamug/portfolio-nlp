[mypy]
show_error_codes = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_untyped_calls = True
check_untyped_defs = True
ignore_missing_imports = True
# apps/*.py and cli/*.py bootstrap `src/` onto sys.path at runtime, so
# without this mypy can't resolve `src/`'s flat modules (db, pipeline, ...)
# from those entrypoints and silently treats every such import as Any.
# Mirrors pytest.ini's `pythonpath = src .` for the same reason.
mypy_path = src
files = src, apps, cli
