[mypy]
show_error_codes = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_untyped_calls = True
check_untyped_defs = True
ignore_missing_imports = True
# apps/*.py and cli/*.py bootstrap `src/` onto sys.path at runtime, so
# without this mypy can't resolve `src/`'s flat modules (pipeline, chunking,
# ...) or the local `news_nlp` package from those entrypoints and silently
# treats every such import as Any. Mirrors pytest.ini's `pythonpath = src .`
# for the same reason.
mypy_path = src
# `tests` joined 2026-09-18 (TASKS.md T-107, PLAN.md Work item 12) after a
# real, systemic type-annotation drift there (tests/news_nlp/conftest.py's
# conn/two_tier_conn fixtures declared sqlite3.Connection while actually
# constructing/returning NewsNlpDatabase) went undetected for as long as
# tests/ sat outside this gate. `scripts` deliberately stays out: one-shot,
# already-completed historical scripts (see CLAUDE.md's `scripts/` note) that
# this project doesn't hold to an ongoing type-quality bar --
# scripts/mine_idiom_sentences_2026_09_13.py has 2 known, unaddressed errors
# of its own (SPEC.md §13 item 17 / PLAN.md Work item 12).
files = src, apps, cli, tests
