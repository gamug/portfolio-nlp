name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Plain `uv sync` (not `--no-sources`): the `[tool.uv.sources]` block now
      # also pins `portfolio-common` to a git tag, and `--no-sources` would drop
      # that pin -> unresolvable. This does pull the cu124 torch wheel (the
      # `pytorch-cu124` index); it imports fine on CPU CI and the test suite
      # monkeypatches every model load, so nothing touches CUDA.
      - name: Sync
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: mypy
        run: uv run --no-sync mypy --config-file=.code_quality/mypy.ini

      - name: pytest
        run: uv run --no-sync pytest -q
