[project]
name = "portfolio-nlp"
version = "0.1.0"
description = "Financial-news NLP pipeline (FinBERT sentiment + SEC-BERT NER + zero-shot category + summarization), extracted from portfolio-data-mining"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- shared DB engine (v1.0.0+): `portfolio_common.db.Database` (the base
    # class `news_nlp.db.NewsNlpDatabase` subclasses) plus the
    # `in_clause`/`Allowlist` injection-safety helpers. The news_nlp
    # results-DB contract itself (schema / two-tier SOURCE/RESULTS connection
    # / queries / sector_summary / corrections / taxonomy) is vendored
    # locally as `src/news_nlp/` -- see docs/portfolio-common-v1-migration-plan.md.
    # As of v1.1.0, `news_nlp.queries.fetch_processed_articles` delegates to
    # `portfolio_common.news_export` -- the one read join shared with
    # portfolio-knowledge-graph, not duplicated -- see
    # docs/portfolio-common-v1.1-news-export.md. Pinned by tag in
    # [tool.uv.sources] -- bump the tag there to adopt a new DB-engine
    # contract.
    "portfolio-common",
    # --- shared web/runtime -----------------------------------------------
    "httpx[http2]>=0.27.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "numpy",
    "tqdm>=4.66",
    # --- news_nlp (sentiment + NER + category + summarization) -----------
    # torch is pinned to what the cu124 wheel index (see [tool.uv.sources]
    # below) publishes - that index stops at 2.6.0, so an unbounded/newer
    # requirement here would make uv fall back to a plain PyPI build.
    "torch>=2.4,<2.7",
    "transformers>=4.40",
    "datasets>=2.19",
    "accelerate>=0.30",
    "evaluate>=0.4",
    "seqeval>=1.2",
    "huggingface_hub>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "ruff==0.16.3",
    "mypy>=1.13",
]

[tool.uv]
package = false

# torch is a direct [project] dependency, but uv still needs to know which
# wheel to fetch. This pins it to the same cu124 build the old
# `pip install torch --index-url https://download.pytorch.org/whl/cu124`
# step used, so `uv sync`/`uv lock` reproduce it exactly. (CI used to pass
# `uv sync --no-sources` to take CPU torch from PyPI, but that also drops the
# portfolio-common git pin below -> unresolvable, so CI now runs a plain
# `uv sync`; the cu124 wheel imports fine on CPU and the suite monkeypatches
# every model load.)
#
# portfolio-common lives in its own repo (github.com/gamug/portfolio-common)
# and is pinned by tag -- bump the tag here to adopt a new schema/DB
# contract. For local work against a checkout next to this repo, override
# with an editable path source:
#   portfolio-common = { path = "../portfolio-common", editable = true }
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
portfolio-common = { git = "https://github.com/gamug/portfolio-common", tag = "v1.1.0" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
