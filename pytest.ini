[pytest]
# "src" makes its flat modules (pipeline, chunking, setup, train_ner) and the
# local news_nlp package (the DB layer -- db / corrections / schema / queries /
# taxonomy / sector_summary, vendored from portfolio-common) importable; "."
# lets tests/news_nlp/conftest.py import apps.news_nlp_api from the repo root.
pythonpath = src .
testpaths = tests
asyncio_mode = auto
markers =
    fast: imports nothing heavy; the whole set runs in seconds (tests/sets.py)
    heavy: imports torch / transformers / mlflow / the pipeline (50 to 400 s here); run by CI
    wi18: Work item 18 (gold, tagging, triage, step-4 texts, figures)
    db: the DB layer and the two-tier store
    eval: LLM-as-judge evaluation and experiments
    stages: the four ML stages, the pipeline and training
    api: the FastAPI service
