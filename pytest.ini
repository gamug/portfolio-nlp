[pytest]
# "src" makes its flat modules (db, pipeline, chunking, ... -- db/categories/
# corrections are now thin re-export facades over portfolio_common.news_nlp,
# which is an installed dependency) importable; "." lets
# tests/news_nlp/conftest.py import apps.news_nlp_api from the repo root.
pythonpath = src .
testpaths = tests
asyncio_mode = auto
